<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prüf-Theme zu Kundenbefund B1, zweite Frage:

      „Weiterhin gehe ich davon aus, dass das stumpf alles abrundet, auch wenn
       ich ein Theme verwende, das keine abgerundeten Ecken hat."

  Auf der Maschine des Kunden liegen acht Desktop-Themes, und **alle acht**
  runden. Die Frage ist damit an installierten Themes nicht zu beantworten.
  Dieses Theme beantwortet sie: Es ist Zeichen für Zeichen der Aufbau von
  `tests/themes/.../denkzettel-test-schmal`, nur sind die vier Eckstücke
  **rechteckig** statt Viertelkreise. Rand 4 px, Eckradius 0, Schattenkacheln
  6 px.

  Kein Gestaltungsvorschlag, kein Bestandteil des Erzeugnisses — ein Messmittel.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="44">
  <g fill="#000000">
    <rect id="topleft"     x="0"  y="0"  width="4"  height="4"/>
    <rect id="top"         x="4"  y="0"  width="8"  height="4"/>
    <rect id="topright"    x="12" y="0"  width="4"  height="4"/>
    <rect id="left"        x="0"  y="4"  width="4"  height="8"/>
    <rect id="center"      x="4"  y="4"  width="8"  height="8"/>
    <rect id="right"       x="12" y="4"  width="4"  height="8"/>
    <rect id="bottomleft"  x="0"  y="12" width="4"  height="4"/>
    <rect id="bottom"      x="4"  y="12" width="8"  height="4"/>
    <rect id="bottomright" x="12" y="12" width="4"  height="4"/>
  </g>
  <g fill="#000000" opacity="0.5">
    <rect id="shadow-topleft"     x="0"  y="20" width="6"  height="6"/>
    <rect id="shadow-top"         x="6"  y="20" width="12" height="6"/>
    <rect id="shadow-topright"    x="18" y="20" width="6"  height="6"/>
    <rect id="shadow-left"        x="0"  y="26" width="6"  height="12"/>
    <rect id="shadow-center"      x="6"  y="26" width="12" height="12"/>
    <rect id="shadow-right"       x="18" y="26" width="6"  height="12"/>
    <rect id="shadow-bottomleft"  x="0"  y="38" width="6"  height="6"/>
    <rect id="shadow-bottom"      x="6"  y="38" width="12" height="6"/>
    <rect id="shadow-bottomright" x="18" y="38" width="6"  height="6"/>
  </g>
</svg>
