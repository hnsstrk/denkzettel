<?xml version="1.0" encoding="UTF-8"?>
<!--
  Test theme of the Denkzettel test suite - NOT a design proposal.

  It exists because the assertion of #55 AK 1 holds two desktop themes with
  different borders against each other, and because such a pair does not exist
  on an arbitrary machine: every theme of the official KDE stack (default,
  breeze-dark, breeze-light) carries 4/4/4/4, and every wider theme on the
  development machine comes from a CachyOS package. A checkout on Fedora,
  Debian or ordinary Arch would find no pair at all - and a build host that
  installs only this project's KF6 parts finds no desktop theme whatsoever,
  because ksvg does not depend on libplasma.

  Border 12 px, corner radius 12 px, shadow tiles 10 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="76">
  <g fill="#000000">
    <path id="topleft"     d="M0,12 A12,12 0 0 0 12,0 L12,12 Z"/>
    <rect id="top"         x="12" y="0" width="8" height="12"/>
    <path id="topright"    d="M20,0 A12,12 0 0 0 32,12 L20,12 Z"/>
    <rect id="left"        x="0" y="12" width="12" height="8"/>
    <rect id="center"      x="12" y="12" width="8" height="8"/>
    <rect id="right"       x="20" y="12" width="12" height="8"/>
    <path id="bottomleft"  d="M0,20 L12,20 L12,32 A12,12 0 0 0 0,20 Z"/>
    <rect id="bottom"      x="12" y="20" width="8" height="12"/>
    <path id="bottomright" d="M20,20 L32,20 A12,12 0 0 0 20,32 Z"/>
  </g>
  <g fill="#000000" opacity="0.5">
    <rect id="shadow-topleft"     x="0" y="36" width="10" height="10"/>
    <rect id="shadow-top"         x="10" y="36" width="20" height="10"/>
    <rect id="shadow-topright"    x="30" y="36" width="10" height="10"/>
    <rect id="shadow-left"        x="0" y="46" width="10" height="20"/>
    <rect id="shadow-center"      x="10" y="46" width="20" height="20"/>
    <rect id="shadow-right"       x="30" y="46" width="10" height="20"/>
    <rect id="shadow-bottomleft"  x="0" y="66" width="10" height="10"/>
    <rect id="shadow-bottom"      x="10" y="66" width="20" height="10"/>
    <rect id="shadow-bottomright" x="30" y="66" width="10" height="10"/>
  </g>
</svg>
