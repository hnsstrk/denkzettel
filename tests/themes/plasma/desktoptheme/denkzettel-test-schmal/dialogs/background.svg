<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pruef-Theme der Denkzettel-Testsuite - KEIN Gestaltungsvorschlag.

  Es existiert, weil die Zusicherung von #55 AK 1 zwei Desktop-Themes mit
  verschiedenem Rand gegeneinander haelt, und weil es die auf einer beliebigen
  Maschine nicht gibt: Alle offiziellen KDE-Themes (default, breeze-dark,
  breeze-light) tragen 4/4/4/4; jedes 8-px-Theme der Entwicklungsmaschine
  stammt aus einem CachyOS-Paket. Ein Auschecken auf Fedora, Debian oder
  gewoehnlichem Arch faende kein Paar - und ein Bauplatz, der nur die
  KF6-Teile dieses Projekts installiert, findet ueberhaupt kein Desktop-Theme,
  denn ksvg haengt nicht an libplasma.

  Rand 4 px, Eckradius 4 px, Schattenkacheln 6 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="44">
  <g fill="#000000">
    <path id="topleft"     d="M0,4 A4,4 0 0 0 4,0 L4,4 Z"/>
    <rect id="top"         x="4" y="0" width="8" height="4"/>
    <path id="topright"    d="M12,0 A4,4 0 0 0 16,4 L12,4 Z"/>
    <rect id="left"        x="0" y="4" width="4" height="8"/>
    <rect id="center"      x="4" y="4" width="8" height="8"/>
    <rect id="right"       x="12" y="4" width="4" height="8"/>
    <path id="bottomleft"  d="M0,12 L4,12 L4,16 A4,4 0 0 0 0,12 Z"/>
    <rect id="bottom"      x="4" y="12" width="8" height="4"/>
    <path id="bottomright" d="M12,12 L16,12 A4,4 0 0 0 12,16 Z"/>
  </g>
  <g fill="#000000" opacity="0.5">
    <rect id="shadow-topleft"     x="0" y="20" width="6" height="6"/>
    <rect id="shadow-top"         x="6" y="20" width="12" height="6"/>
    <rect id="shadow-topright"    x="18" y="20" width="6" height="6"/>
    <rect id="shadow-left"        x="0" y="26" width="6" height="12"/>
    <rect id="shadow-center"      x="6" y="26" width="12" height="12"/>
    <rect id="shadow-right"       x="18" y="26" width="6" height="12"/>
    <rect id="shadow-bottomleft"  x="0" y="38" width="6" height="6"/>
    <rect id="shadow-bottom"      x="6" y="38" width="12" height="6"/>
    <rect id="shadow-bottomright" x="18" y="38" width="6" height="6"/>
  </g>
</svg>
