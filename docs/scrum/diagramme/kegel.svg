<text x="170.00" y="265.00" font-size="11.5" fill="#757575" text-anchor="start" font-weight="normal">1,0 — nicht revidiert</text>
<text transform="translate(34.00 274.00) rotate(-90)" font-size="13" fill="#757575" text-anchor="middle">Revisionsfaktor: Endwert ÷ Erstwert</text>
<text transform="translate(52.00 274.00) rotate(-90)" font-size="11" fill="#757575" text-anchor="middle">logarithmisch — 0,60 und 1,67 stehen gleich weit von 1,0</text>
<line x1="104.00" y1="440.00" x2="690.00" y2="440.00" stroke="#757575" stroke-width="1.2" />
<line x1="156.00" y1="440.00" x2="156.00" y2="446.00" stroke="#757575" stroke-width="1.2" />
