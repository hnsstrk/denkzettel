<text x="660.00" y="261.00" font-size="11.5" fill="#2F7FC4" text-anchor="middle" font-weight="bold">#12</text>
<polygon points="660.00,115.64 668.00,123.64 660.00,131.64 652.00,123.64" fill="#B85C2E" stroke="#B85C2E" stroke-width="1.6" />
<text x="660.00" y="110.64" font-size="11.5" fill="#B85C2E" text-anchor="middle" font-weight="bold">#11</text>
<text x="716.00" y="114.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="bold">Anlass der Revision</text>
<circle cx="724.00" cy="134.00" r="6.2" fill="none" stroke="#2F7FC4" stroke-width="2.2" />
<text x="742.00" y="138.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">keine — nicht revidiert</text>
<circle cx="724.00" cy="160.00" r="6.2" fill="#2F7FC4" />
<text x="742.00" y="164.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">erkenntnis — Gegenstand</text>
<text x="742.00" y="180.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">blieb, Wert verschoben</text>
<polygon points="724.00,194.00 732.00,202.00 724.00,210.00 716.00,202.00" fill="#B85C2E" />
<text x="742.00" y="206.00" font-size="12" fill="#B85C2E" text-anchor="start" font-weight="normal">gegenstand-geändert —</text>
<text x="742.00" y="222.00" font-size="12" fill="#B85C2E" text-anchor="start" font-weight="normal">keine Schätzabweichung</text>
<text x="716.00" y="258.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="bold">Hüllkurve</text>
<line x1="716.00" y1="278.00" x2="732.00" y2="278.00" stroke="#757575" stroke-width="2.2" />
<text x="742.00" y="282.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">Extremwert, gemessen</text>
<line x1="716.00" y1="302.00" x2="732.00" y2="302.00" stroke="#757575" stroke-width="1.4" stroke-dasharray="7 5" />
<text x="742.00" y="306.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">Verbindung, nicht</text>
<text x="742.00" y="322.00" font-size="12" fill="#757575" text-anchor="start" font-weight="normal">gemessen</text>
<text x="48.00" y="548.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Der Faktor misst, wie stark eine Schätzung revidiert wurde — nicht, wie weit sie vom tatsächlichen Aufwand lag;</text>
<text x="48.00" y="566.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">dieser wird im Projekt nicht erhoben. Eine Story, die niemand neu geschätzt hat, steht bei 1,0, auch wenn sie teurer</text>
<text x="48.00" y="584.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">war.</text>
<text x="48.00" y="620.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Belegdichte: 9 Punkte. Die Hüllkurve ist nicht-fallend, aber nicht streng wachsend — im Logarithmus messen die</text>
<text x="48.00" y="638.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Abstände 0,51 · 0,51 · 0,92; die Weitung tritt erst bei Abstand 3 ein. Der obere Rand bei Abstand 3 ruht auf einem</text>
<text x="48.00" y="656.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">einzigen Punkt, und #11 ist als „gegenstand-geändert“ gekennzeichnet: der größte Faktor der Reihe ist zugleich der,</text>
<text x="48.00" y="674.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">der am wenigsten über Schätzgenauigkeit sagt. Ein Kegel im Sinne der Lehrbuchfigur wäre erst mit mehr Punkten je</text>
<text x="48.00" y="692.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Abstand belegt.</text>
<text x="48.00" y="728.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Nicht gezeichnet: 13 Stories, zwischen deren Erstschätzung und Umsetzung keine Gelegenheit zur Revision lag. Ihr</text>
<text x="48.00" y="746.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Faktor ist 1,0 von Konstruktion wegen und keine Messung; sie stehen in schaetzhistorie.json, damit die Auslassung</text>
<text x="48.00" y="764.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">sichtbar bleibt.</text>
</svg>
