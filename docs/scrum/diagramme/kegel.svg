<title>Schätzkegel des Projekts Denkzettel — Revisionsfaktor über dem Abstand zwischen Erstschätzung und Umsetzung</title>
<text x="48.00" y="44.00" font-size="21" fill="#757575" text-anchor="start" font-weight="bold">Schätzkegel — Revisionsfaktor über dem Abstand zur Umsetzung</text>
<text x="48.00" y="68.00" font-size="12.5" fill="#757575" text-anchor="start" font-weight="normal">Denkzettel · Stand Sprint 5 · 9 Punkte in der Kurve, 13 erfasst und nicht gezeichnet · Quelle: Sprint-Protokoll §24</text>
