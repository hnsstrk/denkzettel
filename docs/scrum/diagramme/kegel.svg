<text x="504.00" y="211.96" font-size="11.5" fill="#2F7FC4" text-anchor="start" font-weight="bold">#57</text>
<circle cx="492.00" cy="190.18" r="6.2" fill="#2F7FC4" />
<text x="492.00" y="177.18" font-size="11.5" fill="#2F7FC4" text-anchor="middle" font-weight="bold">#8</text>
