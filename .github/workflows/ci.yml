# Automatischer Bau- und Testlauf.
#
# Die grüne Marke ist KEINE erfüllte DoD: ohne Compositor und ohne das /usr
# dieses Projekts erreicht der Lauf weder die Prüfung am installierten Stand
# noch die Bildprüfung.
#
# Warum ein Arch-Container: derselbe rollende Paketstrom wie die
# Entwicklungsmaschine, ein Fund hier ist dort reproduzierbar. Dass ein
# Upstream-Sprung den Lauf ohne eigene Änderung rot färben kann, ist die dabei
# beabsichtigte Frühwarnung.

name: Bau und Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  # Tragend, nicht Geschmack: GitHub startet `shell: bash` als
  # `bash --noprofile --norc -e -o pipefail`. Ohne diese Zeilen liefe der
  # Vorgabe-Shell ohne pipefail, und die durch `tee` geleiteten Schritte unten
  # meldeten den Rückgabewert von tee. Ein Baufehler liefe grün durch.
  run:
    shell: bash

jobs:
  bau-und-tests:
    name: Bau und Tests (${{ matrix.bautyp }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # WARUM ZWEI BAUTYPEN: Der Unterschied hängt nicht an -O2, sondern an
    # `QT_NO_DEBUG` — Qt6 setzt es über sein CMake-Paket für jeden Bautyp außer
    # `Debug`, und darunter lässt `Q_ASSERT` seine Bedingung ungeprüft. Alles,
    # was in einer Zusicherung steht, hört dort auf zu geschehen. Das ist eine
    # Fehlerklasse, deshalb ein zweiter Bautyp und nicht ein zweiter Prüfsatz.
    # `Release` und nicht `RelWithDebInfo`: beide setzen `QT_NO_DEBUG`, ein
    # dritter Lauf prüfte dieselbe Frage ein zweites Mal.
    strategy:
      # Die beiden Bautypen sind verschiedene Fragen. Bricht der eine ab, ist
      # die Antwort des anderen gerade die Information, die man dann braucht.
      fail-fast: false
      matrix:
        bautyp: [Debug, Release]

    env:
      # Kein Compositor im Container. capturetest, librarytest und shelltest
      # setzen denselben Wert zusätzlich je Test (tests/CMakeLists.txt); die
      # Zeile hier deckt die übrigen ab und widerspricht ihnen nicht.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Bauabhängigkeiten
        # Vier Pakete, die man für entbehrlich halten könnte und die es nicht
        # sind:
        #   plasma-integration und breeze-icons — ohne sie läse
        #   QIcon::fromTheme() leere Namen, librarytest und shelltest wären grün
        #   und wertlos.
        #   libplasma — es liefert die Desktop-Themes selbst; ohne fände KSvg
        #   hier überhaupt kein Theme, und capturetest prüfte den Randfall.
        #   kcolorscheme — der Bau gelänge auch ohne die Zeile, weil ksvg,
        #   libplasma und plasma-integration das Paket mitziehen. Transitiv ist
        #   keine Zusage: verliert eines der drei die Abhängigkeit, bricht der
        #   Bau an einer Stelle, die niemand damit in Verbindung bringt.
        # git wird vor dem Auschecken gebraucht, sonst fällt actions/checkout auf
        # einen Abzug ohne Historie zurück.
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git gettext \
            extra-cmake-modules qt6-base \
            kcolorscheme kconfig kcoreaddons kdbusaddons kglobalaccel ki18n \
            knotifications kstatusnotifieritem ksvg kwidgetsaddons kwindowsystem \
            libplasma plasma-integration breeze-icons appstream clazy clang

      - uses: actions/checkout@v4

      - name: Werkzeugstand festhalten
        # Ohne diese Zeilen ist ein roter Lauf nach einem Upstream-Sprung nicht
        # von einem roten Lauf nach einer Codeänderung zu unterscheiden.
        run: |
          cmake --version | head -1
          gcc --version | head -1
          pacman -Q qt6-base kconfig plasma-integration breeze-icons clang clazy

      - name: Konfigurieren
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.bautyp }}

      - name: Bauen
        # `set -o pipefail` steht hier ein zweites Mal, obwohl `defaults.run.shell`
        # es oben schon setzt. Absicht: Wer diesen Schritt herauskopiert oder die
        # defaults-Zeilen entfernt, nimmt sonst still die Wache mit — die Pipe
        # meldete dann den Rückgabewert von tee statt den des Compilers.
        run: |
          set -o pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee bau.log

      - name: Warnungen zählen
        # Schwelle null, weil der Ist-Stand null ist — eine Schranke darüber
        # misst nichts. `|| true` fängt grep ab: ohne Treffer liefert es 1, und
        # unter `set -e` bräche der Schritt ausgerechnet im Gutfall ab.
        run: |
          anzahl=$(grep -c 'warning:' bau.log || true)
          echo "Compiler-Warnungen: ${anzahl}"
          if [ "${anzahl}" -ne 0 ]; then
            grep 'warning:' bau.log
            echo "::error::${anzahl} Compiler-Warnung(en) — Der Bau muss warnungsarm sein."
            exit 1
          fi

      - name: Tests
        # WARUM -V UND EINE ZAHL DANEBEN. Ein übersprungener Prüfsatz kommt
        # sonst nirgends vor — weder in der Ausgabe von `--output-on-failure`
        # noch im Rückgabewert, der auch bei zehn Übersprungenen 0 ist. Seit dem
        # Testschnitt überspringt keiner mehr; ein neuer soll eine Entscheidung
        # sein und kein Nebeneffekt. Gezählt wird aus den Totals-Zeilen, die
        # `-V` durchreicht: die Zusammenfassung von ctest kennt die
        # Übersprungenen nicht.
        run: |
          set -o pipefail
          ctest --test-dir build -V --output-on-failure > ctest.log 2>&1 || ctest_rc=$?
          grep -E "Test +#[0-9]+:|Totals:|tests passed|Errors while" ctest.log || true
          if [ -n "${ctest_rc:-}" ]; then
            echo "::error::ctest ist fehlgeschlagen. Vollständige Ausgabe:"
            cat ctest.log
            exit "$ctest_rc"
          fi
          uebersprungen=$(awk '/Totals:/ { for (i = 1; i <= NF; i++) if ($i == "skipped,") s += $(i-1) } END { print s+0 }' ctest.log)
          echo "Übersprungene Prüfsätze: ${uebersprungen} (erlaubt: 0)"
          if [ "${uebersprungen}" -ne 0 ]; then
            grep -E "SKIP +:" ctest.log || true
            echo "::error::${uebersprungen} übersprungene(r) Prüfsatz/Prüfsätze — erlaubt ist 0. Was der Lauf nicht prüft, soll eine Entscheidung sein und kein Nebeneffekt."
            exit 1
          fi
          grep -q "100% tests passed" ctest.log

      - name: clazy
        # Nur im Debug-Zweig, und das ist eine Entscheidung mit Preis: die
        # Linter lesen die Compile-Datenbank ihres Baus, im Release-Zweig stünde
        # `QT_NO_DEBUG` darin und clang-tidy sähe `Q_ASSERT` in seiner leeren
        # Fassung. Geprüft wird hier der Quelltext, und der ist in beiden
        # Zweigen derselbe. Wer eine Prüfung baut, die tatsächlich vom Bautyp
        # abhängt, gehört nicht hierher, sondern in einen Schritt, der beide
        # Zweige sieht.
        if: matrix.bautyp == 'Debug'
        # WARUM DREI ZAHLEN UND NICHT EINE. Keine trägt allein, beide Lücken
        # sind gemessen:
        #   `rc` allein ist kein Befundurteil — clazy-standalone liefert rc=0
        #   auch mit Befunden.
        #   Eine Zahl allein ist kein Vollständigkeitsurteil — fehlt eine
        #   .moc-Datei, bricht clazy die Übersetzungseinheit mit `fatal error`
        #   ab, meldet null Befunde und rc=2. Der Zähler sähe aus wie ein
        #   sauberer Lauf über Dateien, die nie analysiert wurden.
        # Bei Schwelle 0 fällt die Zeilenzählung mit der Befundzählung
        # zusammen; `grep -c 'warning:'` zählt aber auch Compiler-Diagnosen mit
        # und Kopfdateibefunde mehrfach. Wer die Schwelle je über null setzt,
        # muss vorher entdoppeln.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-clazy 2>&1 | tee clazy.log || rc=$?
          warnungen=$(grep -c 'warning:' clazy.log || true)
          fehler=$(grep -c 'error:' clazy.log || true)
          echo "lint-clazy: rc=${rc} Warnungen=${warnungen} Fehler=${fehler} (Schwelle 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnungen}" -ne 0 ] || [ "${fehler}" -ne 0 ]; then
            grep -E 'warning:|error:' clazy.log || true
            echo "::error::lint-clazy: rc=${rc}, ${warnungen} Warnung(en), ${fehler} Fehler — erlaubt ist 0/0/0 (#76)."
            exit 1
          fi

      - name: clang-tidy
        # Nur im Debug-Zweig, Begründung eine Stufe höher bei clazy.
        if: matrix.bautyp == 'Debug'
        # Dieselbe Dreizahl wie bei clazy, aus denselben Gründen. Für clang-tidy
        # kommt einer dazu: `grep -c` zählt Rohzeilen, und jede Kopfdatei wird
        # von jeder Übersetzungseinheit erneut gemeldet (gemessen Faktor 9,4).
        # Bei Schwelle 0 folgenlos, darüber eine Falle.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-tidy 2>&1 | tee tidy.log || rc=$?
          warnungen=$(grep -c 'warning:' tidy.log || true)
          fehler=$(grep -c 'error:' tidy.log || true)
          echo "lint-tidy: rc=${rc} Warnungen=${warnungen} Fehler=${fehler} (Schwelle 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnungen}" -ne 0 ] || [ "${fehler}" -ne 0 ]; then
            grep -E 'warning:|error:' tidy.log || true
            echo "::error::lint-tidy: rc=${rc}, ${warnungen} Warnung(en), ${fehler} Fehler — erlaubt ist 0/0/0 (#76)."
            exit 1
          fi
