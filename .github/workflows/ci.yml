# Automatischer Bau- und Testlauf (Kundenentscheidung 04.08.2026).
#
# Er ist die Hälfte des PR-Abbruchkriteriums aus Sprint 4, die ohne menschliche
# Disziplin trägt; die andere Hälfte — Berichte und Befunde am Pull Request —
# ist genau an dieser Disziplin gerissen (PROZESS.md, „PR-Probelauf").
#
# WAS DIESER LAUF NICHT ERSETZT, ausdrücklich:
#   DoD 1 verlangt die Tests auf Ganymed — der Container ist ein zweites Netz,
#   keine Verlegung des Prüfstands.
#   DoD 2 (installierter Stand unter /usr) und DoD 3 (Bildprüfung) erreicht er
#   gar nicht: kein Compositor und kein /usr dieses Projekts. Die fünf
#   Bildläufer (editshots, libraryshots, searchshots, readmeshots,
#   captureshots) baut er seit dem 04.08.2026 mit — gestartet werden sie hier
#   nicht, und ohne Compositor entstünde ohnehin kein prüfbares Bild.
# Wer die grüne Marke für eine erfüllte DoD hält, hat drei ihrer sechs Punkte
# übersprungen.
#
# Warum ein Arch-Container: derselbe rollende Paketstrom wie die
# Entwicklungsmaschine (CachyOS). Ein Fund hier ist auf Ganymed reproduzierbar.
# Das heißt umgekehrt, dass ein Upstream-Sprung den Lauf rot färben kann, ohne
# dass jemand etwas geändert hat — das ist beabsichtigt und die Frühwarnung,
# die ein festgepinntes Abbild nicht gäbe.

name: Bau und Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  # Diese drei Zeilen sind tragend, nicht Geschmack: GitHub startet `shell: bash`
  # als `bash --noprofile --norc -e -o pipefail`. Ohne sie liefe der Vorgabe-Shell
  # ohne pipefail, und der Bau unten — durch `tee` geleitet — meldete den
  # Rückgabewert von tee statt den des Compilers. Ein Baufehler liefe grün durch.
  run:
    shell: bash

jobs:
  bau-und-tests:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    env:
      # Kein Compositor im Container. capturetest, librarytest und shelltest
      # setzen denselben Wert zusätzlich je Test (tests/CMakeLists.txt); die
      # Zeile hier deckt die übrigen ab und widerspricht ihnen nicht.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Bauabhängigkeiten
        # plasma-integration liefert das kde-Plattformthema, breeze-icons die
        # Symbole dazu. Ohne beide läse QIcon::fromTheme() leere Namen —
        # librarytest und shelltest wären dann grün und wertlos (#60, #66, #67).
        # git wird vor dem Auschecken gebraucht, sonst fällt actions/checkout
        # auf einen Abzug ohne Historie zurück.
        #
        # ksvg und kcoreaddons kommen mit der Fensterhülle (#55): KSvg zeichnet
        # `dialogs/background` des Desktop-Themes, KDirWatch bewacht den
        # Themenamen in `plasmarc`. libplasma liefert die Themes selbst —
        # `default` und `breeze-*` liegen darin. Ohne libplasma fände KSvg hier
        # überhaupt kein Theme, und capturetest prüfte den Randfall statt der
        # Sache.
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git gettext \
            extra-cmake-modules qt6-base \
            kconfig kcoreaddons kdbusaddons kglobalaccel ki18n knotifications \
            kstatusnotifieritem ksvg kwidgetsaddons kwindowsystem libplasma \
            plasma-integration breeze-icons appstream clazy clang

      - uses: actions/checkout@v4

      - name: Werkzeugstand festhalten
        # Ohne diese Zeilen ist ein roter Lauf nach einem Upstream-Sprung nicht
        # von einem roten Lauf nach einer Codeänderung zu unterscheiden.
        run: |
          cmake --version | head -1
          gcc --version | head -1
          pacman -Q qt6-base kconfig plasma-integration breeze-icons clang clazy

      - name: Konfigurieren
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

      - name: Bauen
        # `set -o pipefail` steht hier ein zweites Mal, obwohl `defaults.run.shell`
        # es oben schon setzt. Absicht: Wer diesen Schritt herauskopiert oder die
        # defaults-Zeilen entfernt, nimmt sonst still die Wache mit — die Pipe
        # meldete dann den Rückgabewert von tee statt den des Compilers.
        run: |
          set -o pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee bau.log

      - name: Warnungen zählen
        # Die Schwelle steht auf null, weil sie am 04.08.2026 an einem Neubau
        # gemessen null war — auf Ganymed und in diesem Container. Eine Schranke
        # oberhalb des gemessenen Standes wäre keine.
        # `|| true` fängt grep ab: ohne Treffer liefert es 1, und unter `set -e`
        # bräche der Schritt ausgerechnet im Gutfall ab.
        run: |
          anzahl=$(grep -c 'warning:' bau.log || true)
          echo "Compiler-Warnungen: ${anzahl}"
          if [ "${anzahl}" -ne 0 ]; then
            grep 'warning:' bau.log
            echo "::error::${anzahl} Compiler-Warnung(en) — DoD 1 verlangt einen warnungsarmen Bau."
            exit 1
          fi

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: clazy
        # Kundenentscheidung 04.08.2026, Schwelle mit #76 von 3 auf 0 gezogen:
        # die drei Altbefunde (2× range-loop-detach, 1× detaching-temporary)
        # sind geheilt. Eine Schranke, die über dem Ist-Stand hängen bleibt,
        # misst nichts mehr.
        #
        # WARUM DREI ZAHLEN UND NICHT EINE (#76, AK 6). Keine von ihnen trägt
        # allein, beide Lücken sind gemessen:
        #   `rc` allein ist kein Befundurteil — clazy-standalone liefert rc=0
        #   auch mit Befunden.
        #   Eine Zahl allein ist kein Vollständigkeitsurteil — fehlt eine
        #   .moc-Datei, bricht clazy die Übersetzungseinheit mit `fatal error`
        #   ab, meldet **null** Befunde und rc=2. Der Zähler sähe dann aus wie
        #   ein sauberer Lauf über Dateien, die nie analysiert wurden
        #   (docs/scrum/vorberichte/76-linterbefunde/, Feld 4).
        # Bei Schwelle 0 fällt die Zeilenzählung mit der Befundzählung zusammen;
        # `grep -c 'warning:'` zählt aber gemessen auch Compiler-Diagnosen mit
        # und Kopfdateibefunde mehrfach. **Wer die Schwelle je wieder über null
        # setzt, muss vorher entdoppeln** — sonst zählt diese Wache etwas
        # anderes, als ihr Name sagt.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-clazy 2>&1 | tee clazy.log || rc=$?
          warnungen=$(grep -c 'warning:' clazy.log || true)
          fehler=$(grep -c 'error:' clazy.log || true)
          echo "lint-clazy: rc=${rc} Warnungen=${warnungen} Fehler=${fehler} (Schwelle 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnungen}" -ne 0 ] || [ "${fehler}" -ne 0 ]; then
            grep -E 'warning:|error:' clazy.log || true
            echo "::error::lint-clazy: rc=${rc}, ${warnungen} Warnung(en), ${fehler} Fehler — erlaubt ist 0/0/0 (#76)."
            exit 1
          fi

      - name: clang-tidy
        # Neu mit #76. Bis dahin fehlte dieser Schritt, weil clang-tidy bei 81
        # Altbefunden stand und ein Tor unterhalb des Ist-Standes Dauerrot wäre.
        # Die sind geheilt oder tragen ein begründetes NOLINT, also steht das Tor
        # jetzt auf 0.
        #
        # Dieselbe Dreizahl wie bei clazy, aus denselben zwei gemessenen Gründen.
        # Für clang-tidy kommt ein dritter dazu: `grep -c` zählt **Rohzeilen**,
        # und jede Kopfdatei wird von jeder Übersetzungseinheit erneut gemeldet —
        # gemessen Faktor 9,4 bei performance-enum-size (7 Enums, 66 Zeilen).
        # Bei Schwelle 0 ist das folgenlos; darüber wäre es eine Falle.
        #
        # Die Zahlen dieses Schritts gelten für die Standardkonfiguration.
        # Mit -DDENKZETTEL_SPIKE_SPELLFIX=ON nimmt der Glob in CMakeLists.txt
        # tests/spellfixspike.cpp dazu, und die Datei folgt ihrem eigenen Ziel
        # (#76, Entscheidung 5). Der Bau oben konfiguriert ohne den Schalter.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-tidy 2>&1 | tee tidy.log || rc=$?
          warnungen=$(grep -c 'warning:' tidy.log || true)
          fehler=$(grep -c 'error:' tidy.log || true)
          echo "lint-tidy: rc=${rc} Warnungen=${warnungen} Fehler=${fehler} (Schwelle 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnungen}" -ne 0 ] || [ "${fehler}" -ne 0 ]; then
            grep -E 'warning:|error:' tidy.log || true
            echo "::error::lint-tidy: rc=${rc}, ${warnungen} Warnung(en), ${fehler} Fehler — erlaubt ist 0/0/0 (#76)."
            exit 1
          fi
