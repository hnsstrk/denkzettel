# Automated build and test run.
#
# The green badge is NOT a fulfilled DoD: without a compositor and without this
# project's /usr the run reaches neither the check on the installed state nor
# the image check.
#
# Why an Arch container: the same rolling package stream as the development
# machine, a find here is reproducible there. That an upstream jump can turn the
# run red without a change of our own is the early warning intended by it.

name: Build and Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  # Load-bearing, not taste: GitHub starts `shell: bash` as
  # `bash --noprofile --norc -e -o pipefail`. Without these lines the default
  # shell would run without pipefail, and the steps piped through `tee` below
  # would report the return value of tee. A build error would run through green.
  run:
    shell: bash

jobs:
  build-and-tests:
    name: Build and Tests (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # WHY TWO BUILD TYPES: The difference does not hang on -O2 but on
    # `QT_NO_DEBUG` — Qt6 sets it through its CMake package for every build type
    # except `Debug`, and under it `Q_ASSERT` leaves its condition unchecked.
    # Everything that stands inside an assertion stops happening there. That is a
    # class of fault, hence a second build type and not a second test set.
    # `Release` and not `RelWithDebInfo`: both set `QT_NO_DEBUG`, a third run
    # would check the same question a second time.
    strategy:
      # The two build types are different questions. If one aborts, the answer of
      # the other is exactly the information one needs then.
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    env:
      # No compositor in the container. capturetest, librarytest and shelltest set
      # the same value additionally per test (tests/CMakeLists.txt); the line here
      # covers the remaining ones and does not contradict them.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Build dependencies
        # Four packages one might hold to be dispensable and which are not:
        #   plasma-integration and breeze-icons — without them QIcon::fromTheme()
        #   would read empty names, librarytest and shelltest would be green and
        #   worthless.
        #   libplasma — it supplies the desktop themes themselves; without it KSvg
        #   would find no theme here at all, and capturetest would check the edge
        #   case.
        #   qt6-multimedia-ffmpeg — qt6-multimedia depends on the VIRTUAL package
        #   qt6-multimedia-backend, and which of its two providers pacman picks
        #   under --noconfirm follows the order of the sync database, not this
        #   project. The gstreamer one supports a different set of formats;
        #   naming the ffmpeg one is what makes the recording of SPEC 4 the same
        #   here as on the development machine.
        #   ffmpeg — the program, not the libraries. transcribetest converts a
        #   recording to 16 kHz mono WAV with it (SPEC 12), and that step is
        #   the one this project may not do without: the packaged whisper-cli
        #   reads Opus only because its packager linked it against libavformat.
        #   qt6-multimedia-ffmpeg pulls the package in today; transitive is no
        #   promise, and without /usr/bin/ffmpeg the set goes red.
        #   Neither whisper-cpp nor a model is here on purpose: the container
        #   has no graphics card, and the set puts a program of its own in
        #   whisper-cli's place.
        #   kcolorscheme — the build would succeed without the line as well,
        #   because ksvg, libplasma and plasma-integration pull the package in.
        #   Transitive is no promise: if one of the three loses the dependency, the
        #   build breaks at a place nobody connects with it.
        # git is needed before the checkout, otherwise actions/checkout falls back
        # to an export without history.
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git gettext ffmpeg \
            extra-cmake-modules qt6-base qt6-multimedia qt6-multimedia-ffmpeg \
            kcolorscheme kconfig kcoreaddons kdbusaddons kglobalaccel ki18n \
            knotifications kstatusnotifieritem ksvg kwidgetsaddons kwindowsystem \
            kxmlgui \
            libplasma plasma-integration breeze-icons appstream clazy clang

      - uses: actions/checkout@v4

      - name: Record tool versions
        # Without these lines a red run after an upstream jump cannot be told
        # apart from a red run after a code change.
        run: |
          cmake --version | head -1
          gcc --version | head -1
          pacman -Q qt6-base kconfig plasma-integration breeze-icons clang clazy

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        # `set -o pipefail` stands here a second time although `defaults.run.shell`
        # already sets it above. Deliberate: whoever copies this step out or
        # removes the defaults lines otherwise silently takes the guard along — the
        # pipe would then report the return value of tee instead of that of the
        # compiler.
        run: |
          set -o pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee build.log

      - name: Count warnings
        # Threshold zero because the current state is zero — a limit above it
        # measures nothing. `|| true` catches grep: without a hit it returns 1, and
        # under `set -e` the step would abort in the good case of all cases.
        run: |
          count=$(grep -c 'warning:' build.log || true)
          echo "Compiler warnings: ${count}"
          if [ "${count}" -ne 0 ]; then
            grep 'warning:' build.log
            echo "::error::${count} compiler warning(s) — the build must stay free of warnings."
            exit 1
          fi

      - name: Tests
        # WHY -V AND A NUMBER NEXT TO IT. A skipped test set otherwise appears
        # nowhere — neither in the output of `--output-on-failure` nor in the
        # return value, which is 0 even with ten skipped ones. Since the test cut
        # none is skipped any more; a new one should be a decision and not a side
        # effect. Counting is done from the Totals lines that `-V` passes through:
        # the summary of ctest does not know the skipped ones.
        run: |
          set -o pipefail
          ctest --test-dir build -V --output-on-failure > ctest.log 2>&1 || ctest_rc=$?
          grep -E "Test +#[0-9]+:|Totals:|tests passed|Errors while" ctest.log || true
          if [ -n "${ctest_rc:-}" ]; then
            echo "::error::ctest failed. Full output:"
            cat ctest.log
            exit "$ctest_rc"
          fi
          skipped=$(awk '/Totals:/ { for (i = 1; i <= NF; i++) if ($i == "skipped,") s += $(i-1) } END { print s+0 }' ctest.log)
          echo "Skipped test sets: ${skipped} (allowed: 0)"
          if [ "${skipped}" -ne 0 ]; then
            grep -E "SKIP +:" ctest.log || true
            echo "::error::${skipped} skipped test set(s) — allowed is 0. What the run does not check should be a decision and not a side effect."
            exit 1
          fi
          grep -q "100% tests passed" ctest.log

      - name: Strings
        # Two ways a visible string escapes translation, and neither of them
        # turns a test red. A setter handed a literal instead of i18n() never
        # reaches a catalogue at all; and a string whose domain nobody set finds
        # no catalogue either, so the window stays English however the session
        # is set (issue #53, criteria 1 and 4). The first is read out of the
        # source, the second out of the run that has just happened. Thresholds
        # are zero because the current state is zero — a limit above it measures
        # nothing.
        run: |
          bare=$(grep -rnE '(setText|setPlaceholderText|setToolTip|setWindowTitle|setTitle|setToolTipTitle|setToolTipSubTitle|setStatusTip|setAccessibleName|setAccessibleDescription)[[:space:]]*\([[:space:]]*(QStringLiteral|")' src || true)
          if [ -n "${bare}" ]; then
            echo "${bare}"
            echo "::error::A visible string does not go through i18n() — it can never be translated."
            exit 1
          fi
          echo "Visible strings past i18n(): 0"
          domain=$(grep -c 'Domain is not set' ctest.log || true)
          echo "Strings without a translation domain: ${domain} (allowed: 0)"
          if [ "${domain}" -ne 0 ]; then
            grep -m 3 'Domain is not set' ctest.log
            echo "::error::${domain} string(s) without a translation domain — their translation would never take effect."
            exit 1
          fi

      - name: clazy
        # Only in the Debug branch, and that is a decision with a price: the
        # linters read the compile database of their build, in the Release branch
        # `QT_NO_DEBUG` would stand in it and clang-tidy would see `Q_ASSERT` in
        # its empty form. What is checked here is the source text, and that is the
        # same in both branches. Whoever builds a check that actually does depend
        # on the build type does not belong here but in a step that sees both
        # branches.
        if: matrix.build_type == 'Debug'
        # WHY THREE NUMBERS AND NOT ONE. None carries alone, both gaps are
        # measured:
        #   `rc` alone is no verdict on findings — clazy-standalone returns rc=0
        #   even with findings.
        #   A number alone is no verdict on completeness — if a .moc file is
        #   missing, clazy aborts the translation unit with `fatal error`, reports
        #   zero findings and rc=2. The counter would look like a clean run over
        #   files that were never analysed.
        # At threshold 0 the line count coincides with the finding count; but
        # `grep -c 'warning:'` also counts compiler diagnostics along and header
        # findings several times. Whoever ever sets the threshold above zero must
        # deduplicate first.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-clazy 2>&1 | tee clazy.log || rc=$?
          warnings=$(grep -c 'warning:' clazy.log || true)
          errors=$(grep -c 'error:' clazy.log || true)
          echo "lint-clazy: rc=${rc} warnings=${warnings} errors=${errors} (threshold 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnings}" -ne 0 ] || [ "${errors}" -ne 0 ]; then
            grep -E 'warning:|error:' clazy.log || true
            echo "::error::lint-clazy: rc=${rc}, ${warnings} warning(s), ${errors} error(s) — allowed is 0/0/0 (#76)."
            exit 1
          fi

      - name: clang-tidy
        # Only in the Debug branch, reason one step above at clazy.
        if: matrix.build_type == 'Debug'
        # The same three numbers as with clazy, for the same reasons. For
        # clang-tidy one more comes along: `grep -c` counts raw lines, and every
        # header is reported anew by every translation unit (measured factor 9.4).
        # At threshold 0 without consequence, above it a trap.
        run: |
          set -o pipefail
          rc=0
          cmake --build build --target lint-tidy 2>&1 | tee tidy.log || rc=$?
          warnings=$(grep -c 'warning:' tidy.log || true)
          errors=$(grep -c 'error:' tidy.log || true)
          echo "lint-tidy: rc=${rc} warnings=${warnings} errors=${errors} (threshold 0/0/0)"
          if [ "${rc}" -ne 0 ] || [ "${warnings}" -ne 0 ] || [ "${errors}" -ne 0 ]; then
            grep -E 'warning:|error:' tidy.log || true
            echo "::error::lint-tidy: rc=${rc}, ${warnings} warning(s), ${errors} error(s) — allowed is 0/0/0 (#76)."
            exit 1
          fi
