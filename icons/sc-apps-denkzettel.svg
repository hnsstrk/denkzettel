  <g fill="url(#thought)">
    <circle cx="22" cy="18" r="6"/>
    <circle cx="28" cy="20" r="4.5"/>
    <circle cx="16.5" cy="20.5" r="4"/>
    <circle cx="14.5" cy="27.5" r="2.2"/>
    <circle cx="13" cy="31.8" r="1.3"/>
  </g>
  <rect x="14" y="33.5" width="20" height="2.6" rx="1.3" fill="#b8bec3"/>
  <rect x="14" y="38.2" width="14" height="2.6" rx="1.3" fill="#b8bec3"/>
</svg>
